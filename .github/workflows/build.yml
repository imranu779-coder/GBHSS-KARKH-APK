name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-8-jdk python3-pip zip unzip
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Build
        run: |
          rm -f buildozer.spec
          buildozer init
          sed -i 's/title =.*/title = GBHSS KARKH/' buildozer.spec
          sed -i 's/package.name =.*/package.name = gbhsskarkh/' buildozer.spec
          sed -i 's/source.dir =.*/source.dir = ./' buildozer.spec
          sed -i 's/source.include_exts =.*/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
          sed -i 's/version =.*/version = 1.0/' buildozer.spec
          sed -i 's/requirements =.*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/orientation =.*/orientation = portrait/' buildozer.spec
          sed -i 's/#.*fullscreen =.*/fullscreen = 0/' buildozer.spec
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: gbhss-karkh-apk
          path: bin/*.apk
