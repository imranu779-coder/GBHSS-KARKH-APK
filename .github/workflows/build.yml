name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Deps
        run: |
          pip install buildozer cython==0.29.33
          sudo apt update
          sudo apt install -y libltdl-dev
      - name: Accept Licenses
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1051866b74ff" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "y" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
      - name: Build APK
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
