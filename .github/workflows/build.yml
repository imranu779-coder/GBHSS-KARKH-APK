name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk unzip zip
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Create spec if missing
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
            sed -i 's/title = My Application/title = GBHSS KARKH/g' buildozer.spec
            sed -i 's/package.name = myapp/package.name = gbhsskarkh/g' buildozer.spec
            sed -i 's/package.domain = org.test/package.domain = com.gbhss.karkh/g' buildozer.spec
          fi
          cat buildozer.spec

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gbhss-karkh-apk
          path: bin/*.apk
