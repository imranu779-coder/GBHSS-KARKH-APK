name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install buildozer
        run: |
          pip install buildozer cython==0.29.33
          sudo apt-get update && sudo apt-get install -y libltdl-dev
      - name: Download SDK first
        run: buildozer android debug || true
      - name: Fix Licenses for Buildozer SDK
        run: |
          SDK1=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          SDK2=$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDK1 --licenses || true
          yes | $SDK2 --licenses || true
          $SDK1 "build-tools;33.0.2" "build-tools;37.0.0" || true
          $SDK2 "build-tools;33.0.2" "build-tools;37.0.0" || true
      - name: Real Build
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
