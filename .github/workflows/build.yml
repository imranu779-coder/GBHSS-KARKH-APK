name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install System Deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip libssl-dev libffi-dev libbz2-dev libsqlite3-dev
          pip install buildozer cython==0.29.33
      - name: Build
        run: |
          rm -rf .buildozer bin
          buildozer android debug --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GBHSS-KARKH-APK
          path: bin/*.apk
